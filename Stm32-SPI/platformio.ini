; STM32F401CC "Black Pill" -- predictive-maintenance acquisition node
; Dummy-data build: 20 kHz synth sine -> SPI2 slave -> Raspberry Pi 5 / QNX
[env:blackpill_f401cc]
platform     = ststm32
board        = blackpill_f401cc
framework    = stm32cube
build_flags  = -O2 -Wall -Wextra
; Upload via ST-Link (default). For DFU/USB bootloader instead, uncomment:
; upload_protocol = dfu
